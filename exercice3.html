<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 3 - Constantes</title>
</head>
<body>
    <h1>Exercice 3</h1>
    <p>Ouvre la console pour voir les résultats (F12 → Console).</p>

    <script>
        const TAUX_TVA = 0.20;  
        let prixHT = 150;  
        let prixTTC = prixHT + (TAUX_TVA * prixHT);
        let montantTVA = TAUX_TVA * prixHT;
        
        console.log(`Prix HT : ${prixHT} € | TVA (20%) : ${montantTVA} € | Prix TTC : ${prixTTC} €`);

    </script>
</body>
</html>
