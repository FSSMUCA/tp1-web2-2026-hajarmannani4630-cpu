<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 4 - Interaction utilisateur</title>
</head>
<body>
    <h1>Exercice 4</h1>
    <p>Ce script interagit avec toi via des boîtes de dialogue.</p>

    <script>
        let prenom = prompt("Quel est votre prénom ?");
        let age = prompt("Quel est votre âge ?");
        let ageNumber = Number(age);
        let anneeNaissance = 2025 - ageNumber;

        alert(`Bonjour ${prenom} ! Vous êtes né(e) vers ${anneeNaissance}.`);

        let afficherConsole = confirm("Afficher vos informations dans la console ?");

        if (afficherConsole) {
            console.log("Prénom :", prenom);
            console.log("Âge :", ageNumber);
            console.log("Année de naissance :", anneeNaissance);
        } else {
            console.log("Affichage refusé par l'utilisateur.");
        }
    </script>
</body>
</html>
